<app-header [title]="myTitle" [sideNav]="mySideNav"></app-header>
<app-side-menu (setSideNavControl)="setSideNav($event)">
  <ng-template #contentTemplate>
    <div class="content" role="main">
      <div class="content-wrap">
        <div class="content-block">
          <app-shop-card
            [product]="product"
            (increment)="increment()"
            (decrement)="decrement()"
          ></app-shop-card>
          <app-product-card
            [product]="product"
            (addToCart)="addToCartHandler(product)"
          ></app-product-card>
          <app-suggested-product-card
            [product]="product"
          ></app-suggested-product-card>
        </div>
        <div class="terminal">
          <pre>{{ terminalMessage }}</pre>
        </div>
      </div>
    </div>
  </ng-template>
</app-side-menu>
<app-footer></app-footer>
